<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Vesperal</title>
  <!-- The Sun arc of the indicator, in the evening: the Sun late on its arc over a dusk sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2556"/>
      <stop offset="0.5" stop-color="#5b3f8c"/>
      <stop offset="0.82" stop-color="#d9687a"/>
      <stop offset="1" stop-color="#f7a14a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a45"/>
      <stop offset="1" stop-color="#120d26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="badge">
      <rect x="8" y="8" width="240" height="240" rx="56"/>
    </clipPath>
    <!-- A gap around the Sun, so it stands clear of the arc it sits on. -->
    <mask id="around-sun">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="175.0" cy="131.2" r="30" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="256" height="170" fill="url(#sky)"/>
    <rect y="170" width="256" height="86" fill="url(#ground)"/>
    <circle cx="175.0" cy="131.2" r="58" fill="url(#glow)"/>
  </g>

  <g fill="none" stroke="#fff" stroke-linecap="round" mask="url(#around-sun)">
    <!-- The way already behind the Sun, in full; the way still ahead, faded. -->
    <path d="M 48 170 A 80 48 0 0 1 175.0 131.2" stroke-width="10"/>
    <path d="M 175.0 131.2 A 80 48 0 0 1 208 170" stroke-width="6" stroke-opacity="0.45"/>
  </g>
  <line x1="36" y1="170" x2="220" y2="170" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="175.0" cy="131.2" r="21" fill="#fff4d6"/>
</svg>
