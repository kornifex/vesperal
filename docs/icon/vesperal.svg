<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Vesperal</title>
  <!-- The Sun arc of the indicator, in the evening: the Sun late on its arc. -->
  <defs>
    <!-- A gap around the Sun, so it stands clear of the arc it sits on. -->
    <mask id="around-sun">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="173.8" cy="115.1" r="31" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" mask="url(#around-sun)">
    <!-- The way already behind the Sun, in full; the way still ahead, thinner. -->
    <path d="M 50 162 A 78 58 0 0 1 173.8 115.1" stroke-width="11"/>
    <path d="M 173.8 115.1 A 78 58 0 0 1 206 162" stroke-width="6"/>
  </g>
  <line x1="38" y1="162" x2="218" y2="162" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <circle cx="173.8" cy="115.1" r="21" fill="#fff"/>
</svg>
